<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PlatStat - Notification Center</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="app-container">
        <!-- Navigation Header -->
        <nav class="navbar">
            <a href="/" class="nav-brand">
                <img src="/static/favicon.ico" alt="PlatStat Logo" class="nav-logo">
                <span class="nav-title">PlatStat</span>
            </a>
            <button type="button" class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" onclick="toggleMobileNav()">
                <span class="sandwich-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </button>
            <div class="nav-links" id="navLinks">
                <!-- <a href="/dashboard">Dashboard</a> -->
                <a href="/">Analyzer</a>
                <a href="/topper">Topper Calculator</a>
                <a href="/contests">Contest Center</a>
                <a href="/notifications" class="active">Notifications <span class="nav-badge" id="nav_unread_badge" style="display:none;">0</span></a>
            </div>
        </nav>

        <!-- Page Header -->
        <header class="page-header">
            <span class="page-eyebrow">
                <img src="/static/favicon.ico" alt="PlatStat Logo" style="width:16px; height:16px; vertical-align:middle; margin-right:6px; border-radius:4px;">
                NOTIFICATION CENTER
            </span>
            <h1>Alerts & Reminder History</h1>
            <p>View all your contest alerts, subscription notifications, and upcoming contest reminders in a dedicated view.</p>
        </header>

        <!-- Filter & Action Toolbar -->
        <div class="contest-toolbar" style="margin-bottom: 24px;">
            <div class="platform-filter-tabs">
                <button type="button" class="filter-tab active" id="tab_all" onclick="setNotificationFilter('all', this)">All Notifications</button>
                <button type="button" class="filter-tab" id="tab_unread" onclick="setNotificationFilter('unread', this)">Unread Only</button>
            </div>

            <div class="toolbar-actions" style="margin-left: auto;">
                <button type="button" class="btn-secondary" onclick="clearAllNotificationsPage()" style="background: rgba(239, 68, 68, 0.08); border-color: rgba(239, 68, 68, 0.25); color: #dc2626;">🗑️ Clear All</button>
            </div>
        </div>

        <!-- Notification List Grid -->
        <div class="wide-card" style="padding: 24px;">
            <div id="notifications_page_list" style="display: flex; flex-direction: column; gap: 16px;">
                <div class="loading-state">Loading notifications...</div>
            </div>
        </div>
    </div>

    <script>
        let currentFilter = 'all';
        let allNotifications = [];

        function setNotificationFilter(filterMode, btnEl) {
            currentFilter = filterMode;
            document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            renderNotifications();
        }

        function loadNotificationsPage() {
            fetch('/api/notifications')
                .then(res => res.json())
                .then(data => {
                    allNotifications = data.notifications || [];
                    const badge = document.getElementById('nav_unread_badge');
                    if (data.unreadCount > 0) {
                        badge.textContent = data.unreadCount;
                        badge.style.display = 'inline-block';
                    } else {
                        badge.style.display = 'none';
                    }
                    renderNotifications();
                })
                .catch(err => {
                    console.error('Error fetching notifications:', err);
                    document.getElementById('notifications_page_list').innerHTML = '<div class="loading-state" style="color:var(--error-text);">Failed to load notifications.</div>';
                });
        }

        function renderNotifications() {
            const list = document.getElementById('notifications_page_list');
            list.innerHTML = '';

            let filtered = allNotifications;
            if (currentFilter === 'unread') {
                filtered = allNotifications.filter(n => !n.read);
            }

            if (!filtered || filtered.length === 0) {
                list.innerHTML = `
                    <div style="text-align: center; padding: 48px 20px;">
                        <div style="font-size: 44px; margin-bottom: 12px;">🔔</div>
                        <div style="font-family:'Outfit', sans-serif; font-weight:800; font-size:20px; color:var(--text-primary); margin-bottom:6px;">No Notifications</div>
                        <div style="color:var(--text-muted); font-size:14px;">You have no ${currentFilter === 'unread' ? 'unread' : ''} alerts at this time.</div>
                    </div>
                `;
                return;
            }

            filtered.forEach(n => {
                const card = document.createElement('div');
                card.className = `notification-page-card ${n.read ? 'read-card' : 'unread-card'}`;
                
                const timeFormatted = n.createdAt ? new Date(n.createdAt).toLocaleString() : 'Recently';

                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span style="font-size:18px;">🔔</span>
                            <span class="n-page-title">${n.title}</span>
                            ${!n.read ? '<span class="unread-pill">NEW</span>' : ''}
                        </div>
                        <span class="n-page-time">${timeFormatted}</span>
                    </div>
                    <div class="n-page-msg">${n.message}</div>
                    <div style="display:flex; justify-content:flex-end; margin-top:12px;">
                        ${!n.read ? `<button type="button" class="btn-text-action" onclick="markPageNotificationRead('${n.notificationId}')">✓ Mark as read</button>` : '<span style="font-size:12px; color:var(--text-muted);">✓ Read</span>'}
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function markPageNotificationRead(nid) {
            fetch(`/api/notifications/${nid}/read`, { method: 'POST' })
                .then(() => loadNotificationsPage());
        }

        function clearAllNotificationsPage() {
            if (confirm("Are you sure you want to clear all notifications?")) {
                fetch('/api/notifications/clear', { method: 'POST' })
                    .then(() => loadNotificationsPage());
            }
        }

        function toggleMobileNav() {
            const btn = document.getElementById('navToggle');
            const links = document.getElementById('navLinks');
            if (btn && links) {
                btn.classList.toggle('open');
                links.classList.toggle('show');
            }
        }

        document.addEventListener('DOMContentLoaded', loadNotificationsPage);
    </script>
</body>
</html>
